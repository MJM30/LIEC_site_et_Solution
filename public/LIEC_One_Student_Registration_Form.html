/* LIEC brand and accessibility refinements */
:root{--blue:#00bff3;--blue2:#e7faff;--teal:#00d2bd;--teal2:#e6fbf8;--lime:#a2ff35;--lime2:#f2ffe1;--yellow:#fff500;--ink:#17212d;--muted:#64748b;--line:#dfe7ee;--shadow:0 8px 28px rgba(12,50,70,.07)}
body{font-family:Arial,Helvetica,sans-serif;font-size:12px}
button,input,select,textarea{font-family:Arial,Helvetica,sans-serif;font-size:12px}
.brand-home{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:10px;text-align:left;padding:0 9px;color:var(--ink);cursor:pointer}
.brand-home:hover{background:#f2fbff;border-radius:12px}
.brand-logo{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#000}
.brand-home strong{font-size:16px}.brand-home small{font-size:12px;color:var(--muted)}
.nav button{font-size:12px}.nav button.active{background:var(--blue2);color:#007da7;border-left:3px solid var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#00364a}
.brandmark{background:linear-gradient(135deg,var(--blue),var(--teal))}
.stat-icon.si-blue{background:var(--blue2);color:#007da7}.stat-icon.si-teal{background:var(--teal2);color:#008d82}.stat-icon.si-amber{background:var(--lime2);color:#4d7900}.stat-icon.si-red{background:#fffbd1;color:#817900}
.eyebrow{color:#0089a9}.link-btn{color:#007da7}
.pill.blue{background:var(--blue2);color:#007da7}.pill.green{background:var(--teal2);color:#008577}.pill.amber{background:var(--lime2);color:#4d7900}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #00bff31e}


/* Wordmark inspired by the clean, bold branding commonly used on ServiceNow PDI instances */
.brand-home{gap:11px;min-height:48px}
.liec-wordmark{display:inline-flex;align-items:center;gap:0;font-weight:900;font-size:17px;letter-spacing:-1.6px;line-height:1;white-space:nowrap}
.word-l{color:#a2df35}.word-i{color:#00bff3}.word-e{color:#00bfae}.word-c{color:#00bff3}
.brand-copy{display:flex;flex-direction:column;gap:1px}
.brand-copy strong{font-size:14px;font-weight:800;letter-spacing:-.2px;color:#17212d}
.brand-copy small{font-size:11px;color:#64748b}
.brand-logo{display:none!important}
.brand-home:hover .liec-wordmark{filter:saturate(1.12)}
/* New Student is intentionally the standout yellow action */
button.btn.primary[onclick*="openModal('student')"]{background:#fff500!important;border-color:#e5dc00!important;color:#17212d!important;box-shadow:0 5px 12px #e5dc0030!important}
button.btn.primary[onclick*="openModal('student')"]:hover{background:#f2e900!important}


/* Latest branding refinement: embedded symbol with a larger visual footprint */
.brand-home{gap:8px;min-height:56px;padding:2px 7px}
.brand-logo-embedded{display:block!important;width:56px;height:56px;object-fit:contain;background:transparent;border-radius:0;flex:0 0 56px}
.liec-wordmark{font-size:17px;letter-spacing:-1px}
.brand-copy strong{font-size:14px}
.brand-copy small{font-size:11px}
@media(max-width:1100px){.brand-logo-embedded{width:48px;height:48px;flex-basis:48px}}
/* Add task: light blue action */
button.btn[onclick*="openModal('task')"]{background:#e7faff!important;border-color:#bcefff!important;color:#006b91!important;box-shadow:0 4px 10px #00bff31c!important}
button.btn[onclick*="openModal('task')"]:hover{background:#d8f6ff!important}

</style>

function applyRole(){

  document.querySelectorAll("#nav button[data-page]").forEach(b=>{b.style.display=allowed.includes(b.dataset.page)?"flex":"none"});

  const avatar=document.getElementById("userAvatar"); if(avatar) avatar.textContent=({admin:"AD",secretary:"SE",finance:"FO",adviser:"EA"})[currentRole]||"AD";
  if(!allowed.includes(currentPage)) currentPage="dashboard";
}

const pages={
dashboard:{title:"Dashboard",eyebrow:"OVERVIEW",desc:"Your team's daily operations, at a glance."},
students:{title:"Students",eyebrow:"STUDENT MANAGEMENT",desc:"Manage student profiles, contacts and education journeys."},
admissions:{title:"Admissions",eyebrow:"APPLICATION TRACKING",desc:"Follow applications, deadlines and admission decisions."},
training:{title:"PREPA & Training",eyebrow:"LEARNING OPERATIONS",desc:"Manage programmes, cohorts, enrolments and attendance."},
finance:{title:"Finance",eyebrow:"FINANCIAL OPERATIONS",desc:"Track invoices, payments, service charges and balances."},
services:{title:"International Student Services",eyebrow:"PARTNER SERVICES",desc:"Manage blocked account certificates and accommodation proof requests."},
administration:{title:"Secretary & Administration",eyebrow:"DAILY OPERATIONS",desc:"Coordinate appointments, follow-ups, correspondence and tasks."},
documents:{title:"Documents",eyebrow:"SECURE FILES",desc:"Track student documents and verification status."},
reports:{title:"Reports",eyebrow:"INSIGHTS & REPORTING",desc:"Monitor student activity, services and financial operations."},
settings:{title:"Settings",eyebrow:"WORKSPACE CONFIGURATION",desc:"Configure team access, service partners and workflow preferences."}
};
function initials(name){return (name||"New Record").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function pill(text){let t=(text||"").toLowerCase();let c=/accepted|active|received|issued|paid|completed|approved|confirmed/.test(t)?"green":/pending|review|progress|draft|send|requested/.test(t)?"amber":/rejected|overdue|cancelled/.test(t)?"red":/submitted|scheduled|sent/.test(t)?"blue":"gray";return `<span class="pill ${c}">${text||"Not set"}</span>`}
function stat(label,value,icon,color,foot){return `<div class="card stat"><div class="stat-top"><span>${label}</span><span class="stat-icon ${color}">${icon}</span></div><div class="stat-num">${value}</div><div class="stat-foot">${foot}</div></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records found</td></tr>`}</tbody></table></div>`}
function studentRows(list){return list.map(s=>`<tr><td><div class="person"><div class="mini-avatar">${s.initials||initials(s.name)}</div><div><strong>${s.name}</strong><small>${s.email}</small></div></div></td><td>${s.program||"Not assigned"}</td><td>${s.country||"—"}</td><td>${pill(s.status)}</td><td><button class="link-btn" onclick="viewStudent(${s.id})">View details →</button></td></tr>`).join("")}
function serviceRows(list){return list.map(s=>`<tr><td><div class="person"><div class="mini-avatar">${s.type.startsWith("Blocked")?"BA":"AC"}</div><div><strong>${s.type}</strong><small>${s.reference}</small></div></div></td><td>${s.student}</td><td>${s.partner}</td><td>${pill(s.status)}</td><td>${s.date}</td><td><button class="link-btn" onclick="advanceService(${s.id})">Update →</button></td></tr>`).join("")}
function dashboard(){return `<div class="page-head"><div><div class="eyebrow">MONDAY, 23 OCTOBER 2026</div><h1>Good afternoon, Admin 👋</h1><p>Here's what's happening across LIEC today.</p></div><div class="actions"><button class="btn" onclick="openModal('task')">＋ Add a task</button><button class="btn primary" onclick="openModal('student')">＋ New student</button></div></div>
<div class="grid stats">${stat("Total students",students.length,"♙","si-blue",'<span class="positive">●</span> Active student records')}${stat("Applications in progress","24","▤","si-teal","Across all academic programmes")}${stat("Outstanding balance","€ 8,450","€","si-amber","Across education services")}${stat("Partner service requests",serviceRequests.length,"⌂","si-red","Blocked account & accommodation")}</div>
<div class="grid dash-grid"><section class="card panel"><div class="panel-head"><div><h2>Recent students</h2><p>Latest activity in your student database</p></div><button class="link-btn" onclick="navigate('students')">View all →</button></div>${table(["Student","Programme","Country","Status",""],studentRows(students.slice(0,4)))}</section>
<section class="card panel"><div class="panel-head"><div><h2>Needs your attention</h2><p>Priority items for your team</p></div><span class="pill amber">4 items</span></div><div class="task-list"><div class="task"><input type="checkbox"><div><strong>Verify Jordan's academic documents</strong><small>Student file · Due today</small></div></div><div class="task"><input type="checkbox"><div><strong>Send accommodation request</strong><small>Partner service · Due today</small></div></div><div class="task"><input type="checkbox"><div><strong>Follow up on blocked account</strong><small>Financial partner · 2 days ago</small></div></div><div class="task"><input type="checkbox"><div><strong>Confirm PREPA registration</strong><small>Training · Tomorrow</small></div></div></div></section>
<section class="card panel"><div class="panel-head"><div><h2>International services</h2><p>Partner request overview</p></div><button class="link-btn" onclick="navigate('services')">Open module →</button></div>${table(["Request","Student","Status"],serviceRequests.slice(0,3).map(s=>`<tr><td><strong>${s.type}</strong><br><small style="color:#9aa4b5">${s.reference}</small></td><td>${s.student}</td><td>${pill(s.status)}</td></tr>`).join(""))}</section>
<section class="card panel"><div class="panel-head"><div><h2>Recent activity</h2><p>Latest updates across LIEC One</p></div></div><div class="activity"><div class="activity-item"><div class="activity-icon">♙</div><div><strong>New student profile created</strong><p>Amélie Kanku was added to the database.</p><small>Today · 10:42 AM</small></div></div><div class="activity-item"><div class="activity-icon">⌂</div><div><strong>Accommodation proof received</strong><p>Partner document attached to ACC-2026-003.</p><small>Yesterday · 3:15 PM</small></div></div><div class="activity-item"><div class="activity-icon">€</div><div><strong>Invoice payment recorded</strong><p>Registration fee payment recorded.</p><small>Yesterday · 11:06 AM</small></div></div></div></section></div><div class="footer-note">LIEC One demo · Sample data only · Not connected to a live database or partner</div>`}
function studentsPage(){let list=students.filter(s=>Object.values(s).join(" ").toLowerCase().includes(searchTerm));return `<div class="page-head"><div><div class="eyebrow">${pages.students.eyebrow}</div><h1>Students</h1><p>${pages.students.desc}</p></div><div class="actions"><button class="btn" onclick="exportStudents()">↓ Export CSV</button><button class="btn primary" onclick="openModal('student')">＋ Add student</button></div></div><div class="grid stats">${stat("All students",students.length,"♙","si-blue","Registered profiles")}${stat("Active",students.filter(s=>s.status==="Active").length,"✓","si-teal","Currently active")}${stat("Documents pending",students.filter(s=>s.status==="Documents pending").length,"▧","si-amber","Need staff follow-up")}${stat("Countries",new Set(students.map(s=>s.country)).size,"◎","si-red","Represented in demo")}</div><section class="card panel section-card"><div class="toolbar"><input id="localSearch" placeholder="Search students..." value="${escapeHtml(searchTerm)}" oninput="setSearch(this.value)"><select onchange="filterStudentStatus(this.value)"><option value="">All statuses</option><option>Active</option><option>Documents pending</option><option>Accepted</option><option>Application in progress</option></select><button class="btn" onclick="clearSearch()">Reset filters</button></div>${table(["Student","Programme","Country","Status","Actions"],studentRows(list))}</section>`}
function servicesPage(){return `<div class="page-head"><div><div class="eyebrow">${pages.services.eyebrow}</div><h1>International Student Services</h1><p>Coordinate partner requests for financial proof and accommodation proof.</p></div><div class="actions"><button class="btn" onclick="openModal('blocked')">＋ Blocked account</button><button class="btn primary" onclick="openModal('accommodation')">＋ Accommodation</button></div></div><div class="notice"><span>ⓘ</span><div><strong>Partner workflow</strong><br>Blocked account submissions are prepared for a future partner API. Accommodation requests are sent by email. This demo does not transmit real requests or emails.</div></div><div class="grid stats">${stat("All requests",serviceRequests.length,"⌂","si-blue","Across both services")}${stat("Blocked account",serviceRequests.filter(s=>s.type.startsWith("Blocked")).length,"▤","si-teal","Certificate requests")}${stat("Accommodation",serviceRequests.filter(s=>s.type.startsWith("Accommodation")).length,"⌂","si-amber","Accommodation proof")}${stat("Needs follow-up",serviceRequests.filter(s=>/send|review|pending/i.test(s.status)).length,"◷","si-red","Awaiting next action")}</div><section class="card panel section-card"><div class="panel-head"><div><h2>Partner service requests</h2><p>Track request status, partner response and proof delivery.</p></div><button class="btn" onclick="exportServices()">↓ Export CSV</button></div><div class="toolbar"><input placeholder="Search request or student..." id="serviceSearch" oninput="renderServiceTable(this.value)"><select id="serviceTypeFilter" onchange="renderServiceTable(document.getElementById('serviceSearch').value)"><option value="">All services</option><option>Blocked Account Certificate</option><option>Accommodation Proof</option></select></div><div id="serviceTable">${table(["Request","Student","Partner","Status","Created","Action"],serviceRows(serviceRequests))}</div></section><div class="grid module-grid section-card"><div class="card module-card" onclick="openModal('blocked')"><div class="stat-icon si-blue">▤</div><h3>Blocked Account Certificate</h3><p>Register funding proof requests and track partner approval and certificate delivery.</p><footer><span>API-ready workflow</span><span>＋</span></footer></div><div class="card module-card" onclick="openModal('accommodation')"><div class="stat-icon si-teal">⌂</div><h3>Accommodation Proof</h3><p>Prepare email requests, follow up with the accommodation partner and record proof received.</p><footer><span>Email workflow</span><span>＋</span></footer></div></div>`}
function simplePage(key){let p=pages[key];let data={
admissions:{cards:[["Open applications","24","Applications being processed"],["Awaiting documents","8","Need document verification"],["Submitted","12","Sent to institutions"],["Decisions received","4","Latest admissions decisions"]],heads:["Student","Institution / Programme","Submitted","Status"],rows:[["Amélie Kanku","Université de Lyon · Business","18 Oct 2026","Under review"],["Jordan Mbuyi","Université Grenoble Alpes · Data Science","—","Documents pending"],["Nathan Bemba","Université de Lille · Economics","12 Oct 2026","Accepted"]]},
training:{cards:[["Programmes","3","Education programmes"],["Active cohorts","2","Currently running"],["Enrolments","36","Registered learners"],["Attendance","92%","Average demo attendance"]],heads:["Programme / Cohort","Dates","Enrolments","Status"],rows:[["LIEC-France PREPA · 2027-28","Sep 2027 – Jun 2028","24","Registration open"],["French academic preparation","Nov – Feb","12","Active"]]},
finance:{cards:[["Invoiced","€ 14,200","Education services"],["Payments received","€ 5,750","Recorded payments"],["Outstanding","€ 8,450","Awaiting payment"],["Partner charges","€ 1,280","Demo estimate"]],heads:["Reference","Student","Amount","Status"],rows:[["INV-2026-014","Amélie Kanku","€ 450","Partially paid"],["INV-2026-015","Jordan Mbuyi","€ 850","Pending"],["INV-2026-016","Sarah Ilunga","€ 300","Paid"]]},
administration:{cards:[["Open tasks","12","Assigned to the team"],["Appointments today","5","Student meetings"],["Overdue follow-ups","3","Need attention"],["Messages sent","18","This week"]],heads:["Task","Student","Due date","Status"],rows:[["Verify academic documents","Jordan Mbuyi","23 Oct 2026","Pending"],["Partner accommodation follow-up","Jordan Mbuyi","24 Oct 2026","Scheduled"],["PREPA enrolment confirmation","Sarah Ilunga","24 Oct 2026","In progress"]]},
documents:{cards:[["Documents","86","Files in demo index"],["Pending verification","9","Need review"],["Verified","71","Approved by staff"],["Missing","6","Student follow-up"]],heads:["Document","Student","Uploaded","Status"],rows:[["Academic transcript","Amélie Kanku","20 Oct 2026","Verified"],["Passport copy","Jordan Mbuyi","19 Oct 2026","Pending review"],["Accommodation proof","Grace Moke","17 Oct 2026","Verified"]]},
reports:{cards:[["Student records",students.length,"Current demo data"],["Service requests",serviceRequests.length,"Partner services"],["Collected payments","€ 5,750","Demo figure only"],["Open follow-ups","7","Tasks and partner replies"]],heads:["Report","Description","Updated","Action"],rows:[["Student overview","Status and country distribution","Today","Preview"],["Admissions pipeline","Application stages and decisions","Today","Preview"],["Partner services","Blocked account and accommodation","Today","Preview"]]},
settings:{cards:[["Staff users","4","Demo workspace"],["Roles","4","Director, Secretary, Finance, Adviser"],["Partner connections","2","One future API, one email"],["Database","MySQL 8.4","Target production database"]],heads:["Setting","Current configuration","Notes","Status"],rows:[["Database","MySQL 8.4 / InnoDB","Not connected in demo","Planned"],["Blocked account partner","API adapter placeholder","Await partner API docs","Not connected"],["Accommodation partner","Email workflow","Configure recipient and templates","Not configured"]]}
}[key];return `<div class="page-head"><div><div class="eyebrow">${p.eyebrow}</div><h1>${p.title}</h1><p>${p.desc}</p></div><div class="actions"><button class="btn" onclick="toast('This is a front-end demo; live integration is not configured.')">ⓘ Demo info</button><button class="btn primary" onclick="openModal('${key==='training'?'training':key==='finance'?'invoice':key==='administration'?'task':key==='documents'?'document':key==='admissions'?'application':'student'}')">＋ Add record</button></div></div><div class="grid stats">${data.cards.map((c,i)=>stat(c[0],c[1],["▤","✓","◷","€"][i],["si-blue","si-teal","si-amber","si-red"][i],c[2])).join("")}</div><section class="card panel section-card"><div class="panel-head"><div><h2>${p.title} overview</h2><p>Illustrative sample records for interface testing</p></div><button class="btn" onclick="toast('Export will be available after backend integration.')">↓ Export</button></div>${table(data.heads,data.rows.map(row=>`<tr>${row.map((v,i)=>`<td>${i===row.length-1?pill(v):v}</td>`).join("")}</tr>`).join(""))}</section>${key==='settings'?`<section class="card panel section-card"><h2 style="margin-top:0">Architecture notes</h2><p style="color:var(--muted)">This browser demo stores student and partner-service examples in local browser storage. It does not connect to MySQL, send emails, or call a partner API.</p></section>`:''}`}
function modulesPage(){return `<div class="page-head"><div><div class="eyebrow">WORKSPACE</div><h1>All modules</h1><p>Explore the LIEC One education management workspace.</p></div></div><div class="grid module-grid">${Object.keys(pages).filter(k=>k!=="dashboard").map(k=>`<div class="card module-card" onclick="navigate('${k}')"><div class="stat-icon si-blue">${({"students":"♙","admissions":"▤","training":"▣","finance":"€","services":"⌂","administration":"☷","documents":"▧","reports":"▥","settings":"⚙"})[k]}</div><h3>${pages[k].title}</h3><p>${pages[k].desc}</p><footer><span>Open module</span><span>→</span></footer></div>`).join("")}</div>`}
function render(){applyRole();document.getElementById("crumb").textContent=pages[currentPage].title;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage));document.getElementById("content").innerHTML=currentPage==="dashboard"?dashboard():currentPage==="students"?studentsPage():currentPage==="services"?servicesPage():simplePage(currentPage);document.getElementById("sidebar").classList.remove("open")}
function navigate(page){const allowed=roleAccess[currentRole]||roleAccess.admin;currentPage=(pages[page]&&allowed.includes(page))?page:"dashboard";searchTerm="";document.getElementById("globalSearch").value="";render();window.scrollTo({top:0,behavior:"smooth"})}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),2800)}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setSearch(v){searchTerm=v;const pos=document.getElementById("localSearch")?.selectionStart;render();const el=document.getElementById("localSearch");if(el){el.focus();el.setSelectionRange(pos,pos)}}
function clearSearch(){searchTerm="";render()}
function filterStudentStatus(status){const list=students.filter(s=>(!status||s.status===status)&&Object.values(s).join(" ").toLowerCase().includes(searchTerm));document.querySelector("#content tbody").innerHTML=studentRows(list)||""}
function viewStudent(id){let s=students.find(x=>x.id===id);if(s)toast(`${s.name} · ${s.email} · ${s.status}`)}
function renderServiceTable(q=""){let type=document.getElementById("serviceTypeFilter")?.value||"";let list=serviceRequests.filter(s=>(!type||s.type===type)&&Object.values(s).join(" ").toLowerCase().includes(q.toLowerCase()));document.getElementById("serviceTable").innerHTML=table(["Request","Student","Partner","Status","Created","Action"],serviceRows(list))}
function advanceService(id){let s=serviceRequests.find(x=>x.id===id);if(!s)return;let options=s.type.startsWith("Blocked")?["Draft","Documents pending","Under internal review","Ready for submission","Submitted to partner","Partner review","Approved","Certificate issued","Certificate delivered","Rejected"]:["Draft","Documents pending","Under internal review","Email to send","Email sent","Partner acknowledged","Accommodation proposed","Proof received","Closed"];let next=(options.indexOf(s.status)+1)%options.length;s.status=options[next];persist();render();toast(`Demo status updated: ${s.status}`)}
function persist(){localStorage.setItem("liec_students",JSON.stringify(students));localStorage.setItem("liec_services",JSON.stringify(serviceRequests))}
const fieldSets={
student:{title:"Register a student",fields:[["name","Student full name","text",true],["email","Student email address","email",true],["phone","Phone number (include country code)","tel",true],["country","Country","text",true],["town","Town / City","text",true],["program","Programme of interest","text",false],["status","Student status","select",true,["Application in progress","Documents pending","Active","Accepted"]]]},
blocked:{title:"New blocked account request",fields:[["student","Student","select",true,()=>students.map(s=>s.name)],["targetAmount","Target amount (€)","number",true],["nationality","Nationality","text",true],["studyStart","Expected study start","date",false],["notes","Internal notes","textarea",false]]},
accommodation:{title:"New accommodation request",fields:[["student","Student","select",true,()=>students.map(s=>s.name)],["city","Destination city","text",true],["arrival","Expected arrival","date",true],["departure","Expected departure","date",false],["budget","Monthly budget (€)","number",false],["type","Accommodation type","select",true,["Student residence","Studio","Shared accommodation","Other"]],["notes","Request notes","textarea",false]]},
task:{title:"Create task",fields:[["title","Task title","text",true],["student","Related student","select",false,()=>["—",...students.map(s=>s.name)]],["due","Due date","date",false],["priority","Priority","select",true,["Normal","High","Urgent"]]]},
application:{title:"New application",fields:[["student","Student","select",true,()=>students.map(s=>s.name)],["institution","Institution","text",true],["program","Programme","text",true],["year","Academic year","text",true],["status","Status","select",true,["Draft","Documents pending","Under review","Submitted"]]]},
training:{title:"New training cohort",fields:[["name","Cohort name","text",true],["program","Training programme","text",true],["start","Start date","date",true],["end","End date","date",true],["capacity","Capacity","number",true]]},
invoice:{title:"New invoice (demo)",fields:[["student","Student","select",true,()=>students.map(s=>s.name)],["description","Service description","text",true],["amount","Amount (€)","number",true],["due","Due date","date",false]]},
document:{title:"Register document (demo)",fields:[["student","Student","select",true,()=>students.map(s=>s.name)],["name","Document name","text",true],["status","Verification status","select",true,["Pending review","Verified","Missing","Rejected"]]]}
};
function openModal(mode){modalMode=mode;let cfg=fieldSets[mode]||fieldSets.student;document.getElementById("modalTitle").textContent=cfg.title;document.getElementById("formFields").innerHTML=cfg.fields.map(f=>{let val=f[3];let opts=typeof f[4]==="function"?f[4]():f[4];let input=f[2]==="select"?`<select name="${f[0]}" ${val?"required":""}>${(opts||[]).map(o=>`<option>${escapeHtml(o)}</option>`).join("")}</select>`:f[2]==="textarea"?`<textarea name="${f[0]}" ${val?"required":""}></textarea>`:`<input name="${f[0]}" type="${f[2]}" ${val?"required":""} ${f[2]==="number"?'min="0" step="0.01"':""}>`;return `<div class="field ${f[2]==="textarea"?"full":""}"><label>${f[1]}${val?" *":""}</label>${input}</div>`}).join("");document.getElementById("modalBackdrop").classList.add("show")}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show")}
document.getElementById("closeModal").onclick=closeModal;document.getElementById("cancelModal").onclick=closeModal;document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
document.getElementById("recordForm").addEventListener("submit",e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(modalMode==="student"){students.unshift({...data,id:Date.now(),initials:initials(data.name)});persist();closeModal();navigate("students");toast("Student saved in this browser demo.");return}
if(modalMode==="blocked"||modalMode==="accommodation"){let isB=modalMode==="blocked";let id=Date.now();serviceRequests.unshift({id,student:data.student,type:isB?"Blocked Account Certificate":"Accommodation Proof",reference:(isB?"BAC-":"ACC-")+new Date().getFullYear()+"-"+String(serviceRequests.length+1).padStart(3,"0"),status:"Under internal review",partner:isB?"Financial partner":"Accommodation partner",date:new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),details:data});persist();closeModal();navigate("services");toast(isB?"Blocked account request registered. No partner API was called.":"Accommodation request registered. No email was sent.");return}
closeModal();toast("Demo record captured in the interface. Backend persistence is not connected.")});
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)navigate(b.dataset.page)});
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){searchTerm=e.target.value;navigate("students");document.getElementById("globalSearch").value=searchTerm;render()}});
document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.getElementById("roleSwitcher").addEventListener("change",e=>{currentRole=e.target.value;localStorage.setItem("liec_demo_role",currentRole);applyRole();render();toast("Preview role changed to "+e.target.options[e.target.selectedIndex].text+". Production permissions must be enforced server-side.");});
function csvDownload(name,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportStudents(){csvDownload("liec-students-demo.csv",[["Student full name","Student email address","Phone number","Country","Town / City","Programme","Status"],...students.map(s=>[s.name,s.email,s.phone,s.country,s.town,s.program,s.status])])}
function exportServices(){csvDownload("liec-partner-services-demo.csv",[["Reference","Student","Service","Partner","Status","Date"],...serviceRequests.map(s=>[s.reference,s.student,s.type,s.partner,s.status,s.date])])}
render();
</script>
</body></html>
